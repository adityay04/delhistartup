name: Daily Startup Funding Update

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Import up to 25 recent stories (additional Apify cost)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-startup-funding-update
  cancel-in-progress: false

jobs:
  update-funding-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run daily update script
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          FUNDING_BACKFILL: ${{ github.event.inputs.backfill || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node daily-update.js
